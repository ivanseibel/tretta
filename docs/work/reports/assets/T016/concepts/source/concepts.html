<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>T016 — Mockup da mesa acessível</title>
<!--
  Mockup estático da T016. Não é código de produção: serve para renderizar os
  PNGs em viewport exato e medir as regiões. Estado escolhido por ?state=s1..s7.
  Tokens espelhados em ../../../T016-spec.md.
-->
<style>
:root {
  /* Identidade T008 */
  --felt: #194832;
  --felt-glow: #1e5239;
  --felt-deep: #153d2a;
  --seat-bg: #123526;
  --seat-line: #93b596;
  --paper: #fffaf0;
  --paper-shade: #ece4d2;
  --paper-line: #d9cfbb;
  --wood: #d6bd78;
  --wood-dark: #a88a45;
  --wood-hi: #f3e2a8;
  --lamp: #ffd36c;
  --lamp-soft: #fff0bd;
  --ink: #203a2f;
  --ink-muted: #4d5e54;
  --mist: #dce9d7;
  --alert: #b84331;
  --gold-ink: #7a5200;
  --red: #b83c2b;
  --yellow: #e8b941;
  --yellow-ink: #342a10;
  --green: #2e6542;
  --blue: #236394;
  --wild: #574276;
  --wild-2: #664c82;
  --card-edge: #5b4a22;

  --serif: Georgia, 'Times New Roman', serif;
  --sans: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;

  /* Escala (mobile padrão) */
  --frame: 4px;
  --pad: 8px;
  --gap: 8px;
  --hdr-h: 56px;
  --cell-pad-x: 5px;
  --cell-pad-y: 5px;
  --strip-col-gap: 12px;
  --strip-row-gap: 14px;
  --lane: 0px;
  --avatar: 24px;
  --drawer-h: 52px;
  --band-h: 56px;
  --card-gap: 9px;
  --hand-pad: 8px;
  --monte-w: 56px;
  --discard-w: 80px;
  --radius-shell: 20px;
  --radius-panel: 18px;
  --radius-card: 11px;
  --radius-cell: 12px;
  --radius-btn: 12px;
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  font-family: var(--sans);
  font-size: 16px;
  color: var(--paper);
  background: linear-gradient(155deg, #f8f3e8, #f4efe3 62%, #e9e2d2);
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}
button { font: inherit; color: inherit; cursor: pointer; }

.app { position: relative; height: 100vh; display: flex; flex-direction: column; }

/* ---------- Shell (mesa de feltro com borda de madeira) ---------- */
.shell {
  position: relative;
  flex: 1 1 auto;
  min-height: 0;
  display: flex;
  flex-direction: column;
  gap: var(--gap);
  padding: var(--pad);
  border: var(--frame) solid var(--wood);
  border-radius: var(--radius-shell) var(--radius-shell) 0 0;
  border-bottom-width: 0;
  /* Sem textura: só um brilho suave de lâmpada sobre o centro. */
  background: radial-gradient(ellipse 80% 45% at 50% 42%, var(--felt-glow), var(--felt) 70%);
  box-shadow: inset 0 0 0 1px rgba(243, 226, 168, 0.35);
}
.region { position: relative; flex: 0 0 auto; }

/* ---------- Cabeçalho ---------- */
.hdr { height: var(--hdr-h); display: flex; align-items: center; gap: 8px; }
.plate {
  flex: 1 1 auto; min-width: 0; height: 100%;
  display: flex; align-items: center; gap: 10px;
  padding: 0 12px 0 8px;
  border-radius: 14px;
  background: var(--seat-bg);
  border: 2px solid var(--lamp);
}
.plate .avatar { --avatar: 36px; }
.plate-text { min-width: 0; display: flex; flex-direction: column; justify-content: center; }
.turn-text { font-size: 20px; line-height: 24px; font-weight: 700; color: var(--paper); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.turn-text b { color: var(--lamp); }
.dir-text { font-size: 18px; line-height: 22px; color: var(--mist); display: flex; align-items: center; gap: 6px; white-space: nowrap; }
.dir-text svg { width: 18px; height: 18px; flex: 0 0 auto; }
.own-turn .plate { background: var(--lamp); border-color: var(--lamp-soft); box-shadow: 0 0 0 3px rgba(255, 211, 108, 0.25); }
.own-turn .plate .turn-text, .own-turn .plate .turn-text b { color: var(--ink); }
.own-turn .plate .dir-text { color: var(--ink); }
.spark { font-size: 20px; color: var(--ink); }
.icon-btn {
  flex: 0 0 auto; width: 48px; height: 48px;
  display: grid; place-items: center;
  border-radius: var(--radius-btn);
  border: 2px solid var(--mist);
  background: transparent; color: var(--paper);
}
.icon-btn svg { width: 22px; height: 22px; }
.hdr-tabs { display: none; }

/* Faixa transitória (sobreposição, 2,5s) */
.toast {
  position: absolute; z-index: 20;
  left: var(--pad); right: var(--pad); top: var(--pad);
  height: var(--hdr-h);
  display: flex; align-items: center; gap: 12px;
  padding: 0 14px;
  border-radius: 14px;
  background: var(--lamp); color: var(--ink);
  border: 2px solid var(--ink);
  box-shadow: 0 10px 24px rgba(6, 31, 20, 0.45);
}
.toast svg { width: 30px; height: 30px; flex: 0 0 auto; }
.toast-lines { min-width: 0; }
.toast-l1, .toast-l2 { font-size: 20px; line-height: 24px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.toast-l2 { font-weight: 600; }
.toast-timer { position: absolute; left: 12px; right: 12px; bottom: 4px; height: 3px; border-radius: 2px; background: rgba(32,58,47,.25); }
.toast-timer::after { content: ''; position: absolute; inset: 0 40% 0 0; border-radius: 2px; background: var(--ink); }

/* ---------- Faixa de assentos ---------- */
.strip { padding-bottom: var(--lane); }
.strip-note {
  display: flex; align-items: center; gap: 8px;
  height: 32px; margin-bottom: 6px; padding: 0 10px;
  border-radius: 10px; background: var(--seat-bg); border: 2px dashed var(--seat-line);
  font-size: 16px; font-weight: 600; color: var(--paper);
}
.strip-note svg { width: 20px; height: 20px; }
.seats { position: relative; display: grid; column-gap: var(--strip-col-gap); row-gap: var(--strip-row-gap); }
.track { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; z-index: 0; }
.seat {
  position: relative; z-index: 1;
  min-width: 0;
  display: flex; flex-direction: column; align-items: stretch; gap: 2px;
  padding: var(--cell-pad-y) var(--cell-pad-x);
  border-radius: var(--radius-cell);
  border: 2px solid var(--seat-line);
  background: var(--seat-bg);
  text-align: left;
}
.seat-top { height: var(--avatar); display: flex; align-items: center; justify-content: space-between; gap: 3px; }
.seat-name { font-size: 16px; line-height: 20px; font-weight: 600; color: var(--paper); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.seat-count { height: 28px; display: flex; align-items: baseline; gap: 4px; white-space: nowrap; }
.count-num { font-size: 26px; line-height: 28px; font-weight: 800; font-variant-numeric: tabular-nums; color: var(--paper); }
.count-lbl { font-size: 14px; line-height: 16px; font-weight: 600; color: var(--mist); }
.tag { font-size: 16px; line-height: 20px; font-weight: 700; color: var(--mist); white-space: nowrap; }
.tag-turn { font-size: 14px; line-height: 18px; font-weight: 800; padding: 1px 0; color: var(--ink); white-space: nowrap; }
.seat.me { border-color: var(--paper); }
.seat.turn { background: var(--lamp); border-color: var(--lamp-soft); box-shadow: 0 0 0 3px rgba(255, 211, 108, 0.28), 0 6px 14px rgba(6, 31, 20, 0.35); }
.seat.turn .seat-name { color: var(--ink); font-weight: 800; }
.seat.turn .count-num { color: var(--ink); }
.seat.turn .count-lbl { color: var(--ink); }
.seat.off { border-style: dashed; }
.seat.off .avatar { filter: grayscale(1); opacity: .55; }
.seat.sub { border-style: dotted; border-width: 3px; padding: calc(var(--cell-pad-y) - 1px) calc(var(--cell-pad-x) - 1px); }
.seat.focus { outline: 3px solid var(--lamp); outline-offset: 3px; }
.seat.turn.focus { outline-color: var(--paper); }
.seat.empty-slot { visibility: hidden; }

.strip-scroller { position: relative; overflow: hidden; }
.strip-hint {
  position: absolute; top: 0; bottom: var(--lane); width: 14px; z-index: 2;
  display: grid; place-items: center; color: var(--lamp);
}
.strip-hint svg { width: 12px; height: 22px; }
.strip-hint.right { right: 0; }
.strip-hint.left { left: 0; }

/* Avatar */
.avatar { width: var(--avatar); height: var(--avatar); flex: 0 0 auto; border-radius: 50%; background: var(--paper); display: grid; place-items: center; box-shadow: 0 0 0 1.5px rgba(32,58,47,.35); }
.avatar svg { width: 92%; height: 92%; }

/* ---------- Centro ---------- */
.center { display: flex; align-items: center; justify-content: center; gap: 22px; padding: 2px 0; }
.pile { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.pile-lbl { font-size: 14px; line-height: 18px; font-weight: 700; color: var(--mist); }
.monte-line { display: flex; align-items: baseline; gap: 6px; height: 24px; }
.monte-num { font-size: 20px; line-height: 24px; font-weight: 800; color: var(--paper); font-variant-numeric: tabular-nums; }
.back {
  width: var(--monte-w); aspect-ratio: 1 / 1.42; border-radius: 9px;
  border: 3px solid #fff8e7;
  background: repeating-linear-gradient(45deg, #f1d275 0 6px, #e1b94d 6px 12px);
  box-shadow: 0 0 0 1px var(--card-edge), 3px 3px 0 #b8944d, 0 8px 14px rgba(8, 33, 23, 0.32);
}
.discard .card { width: var(--discard-w); }
.active { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; }
.chip {
  height: 44px; display: inline-flex; align-items: center; gap: 8px;
  padding: 0 16px 0 12px; border-radius: 22px;
  border: 2px solid var(--paper);
  font-size: 18px; font-weight: 800; color: #fff; white-space: nowrap;
}
.chip .sym { font-size: 18px; }

/* ---------- Cartas ---------- */
.card {
  position: relative; flex: 0 0 auto;
  aspect-ratio: 1 / 1.42;
  border-radius: var(--radius-card);
  border: 3px solid #fff8e7;
  color: #fff;
  display: flex; flex-direction: column; align-items: center; justify-content: space-between;
  padding: 7px 4px 6px;
  box-shadow: 0 0 0 1px var(--card-edge), 0 3px 0 #d7c8aa, 0 6px 12px rgba(8, 33, 23, 0.22);
  text-align: center;
  overflow: hidden;
}
.card::after { content: ''; position: absolute; inset: 4px; border: 1px solid rgba(255, 255, 255, 0.45); border-radius: 7px; pointer-events: none; }
.card .c-sym { font-size: 18px; line-height: 18px; font-weight: 900; align-self: flex-start; padding-left: 4px; }
.card .c-val { font-size: 30px; line-height: 32px; font-weight: 800; letter-spacing: -0.02em; }
.card .card-name { font-size: 14px; line-height: 16px; font-weight: 700; max-width: 100%; overflow-wrap: anywhere; min-height: 32px; display: flex; align-items: flex-end; justify-content: center; }
.c-red { background: var(--red); }
.c-yellow { background: var(--yellow); color: var(--yellow-ink); }
.c-yellow::after { border-color: rgba(52, 42, 16, 0.25); }
.c-green { background: var(--green); }
.c-blue { background: var(--blue); }
.c-wild { background: linear-gradient(145deg, #49345e, var(--wild-2)); }
.card.playable { box-shadow: 0 0 0 1px var(--card-edge), 0 0 0 4px var(--paper), 0 0 0 7px var(--gold-ink), 0 6px 12px rgba(8, 33, 23, 0.22); }
.card.focus { outline: 3px solid var(--ink); outline-offset: 9px; }
.card.selected { box-shadow: 0 0 0 1px var(--card-edge), 0 0 0 4px var(--paper), 0 0 0 8px var(--alert), 0 10px 16px rgba(8, 33, 23, 0.3); }
.check { position: absolute; z-index: 2; right: 5px; top: 5px; width: 24px; height: 24px; border-radius: 50%; background: var(--paper); color: var(--alert); display: grid; place-items: center; font-size: 16px; font-weight: 900; box-shadow: 0 0 0 2px var(--alert); }

/* ---------- Ações ---------- */
.band { height: var(--band-h); display: flex; align-items: center; gap: 8px; }
.btn {
  height: 44px; padding: 0 14px; border-radius: var(--radius-btn);
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  font-size: 16px; font-weight: 700; white-space: nowrap;
  border: 2px solid var(--mist); background: transparent; color: var(--paper);
}
.btn svg { width: 18px; height: 18px; flex: 0 0 auto; }
.btn-primary { height: 56px; padding: 0 22px; font-size: 18px; background: var(--lamp); color: var(--ink); border: 2px solid var(--lamp-soft); box-shadow: 0 3px 0 #b8944d, 0 8px 16px rgba(6,31,20,.3); }
.btn-primary.focus { outline: 3px solid var(--paper); outline-offset: 3px; }
.waiting {
  flex: 1 1 auto; min-width: 0; height: 44px;
  display: flex; align-items: center; gap: 10px; padding: 0 4px;
  font-size: 16px; color: var(--mist); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.waiting .dots { display: inline-flex; gap: 4px; }
.waiting .dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--lamp); display: block; }
.waiting b { color: var(--paper); }
.band .spacer { flex: 1 1 auto; }
.btn-danger { border-color: #f2b8ab; color: #ffe3dc; }

/* ---------- Mão ---------- */
.hand {
  position: relative;
  padding: 4px var(--hand-pad) 10px;
  border-radius: var(--radius-panel);
  background: var(--paper);
  border: 2px solid var(--wood);
  color: var(--ink);
  box-shadow: 0 10px 22px rgba(6, 31, 20, 0.28);
}
.own-turn .hand { border: 3px solid var(--lamp); padding: 3px calc(var(--hand-pad) - 1px) 9px; box-shadow: 0 0 0 3px rgba(255, 211, 108, 0.25), 0 10px 22px rgba(6, 31, 20, 0.28); }
.hand-head { height: 44px; display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
.hand-title { font-family: var(--serif); font-size: 21px; font-weight: 700; letter-spacing: -0.02em; color: var(--ink); }
.help {
  width: 44px; height: 44px; border-radius: 50%;
  border: 2px solid var(--ink); background: var(--paper-shade); color: var(--ink);
  font-size: 18px; font-weight: 800; display: grid; place-items: center; flex: 0 0 auto;
}
.hand-count { font-size: 16px; color: var(--ink-muted); font-weight: 600; white-space: nowrap; }
.hand-head .spacer { flex: 1 1 auto; }
.yourturn { height: 34px; display: inline-flex; align-items: center; gap: 6px; padding: 0 12px; border-radius: 17px; background: var(--lamp); border: 2px solid var(--gold-ink); color: var(--ink); font-size: 16px; font-weight: 800; white-space: nowrap; }
.cards {
  display: grid;
  grid-template-columns: repeat(4, minmax(72px, 96px));
  justify-content: center;
  gap: 10px var(--card-gap);
}
.cards .card { width: 100%; }
.hand.one-row .cards { grid-template-columns: none; grid-auto-flow: column; grid-auto-columns: 72px; justify-content: start; overflow: hidden; margin-right: 14px; }
.hand-hint { position: absolute; right: 4px; bottom: 10px; height: 102px; width: 14px; display: none; place-items: center; color: var(--gold-ink); }
.hand.one-row .hand-hint { display: grid; }
.hand-hint svg { width: 12px; height: 22px; }

/* Barra de confirmação sobreposta */
.confirm {
  position: absolute; z-index: 5; left: 8px; right: 8px; bottom: 10px;
  min-height: 64px; padding: 8px 8px 8px 14px;
  display: flex; align-items: center; gap: 8px;
  border-radius: 14px; background: var(--ink); color: var(--paper);
  border: 2px solid var(--lamp);
  box-shadow: 0 12px 26px rgba(6, 31, 20, 0.45);
}
.confirm-text { flex: 1 1 auto; min-width: 0; font-size: 18px; font-weight: 700; line-height: 22px; }
.confirm-text small { display: block; font-size: 16px; font-weight: 500; color: var(--mist); }
.confirm .btn-go { height: 48px; padding: 0 18px; border-radius: 12px; border: 2px solid var(--lamp-soft); background: var(--lamp); color: var(--ink); font-size: 18px; font-weight: 800; }
.confirm .btn { color: var(--paper); border-color: var(--mist); }

/* Observador */
.watch { display: flex; flex-direction: column; gap: 8px; padding: 14px 16px 16px; }
.watch h2 { margin: 0; font-family: var(--serif); font-size: 21px; color: var(--ink); }
.watch p { margin: 0; font-size: 16px; line-height: 22px; color: var(--ink); }
.watch .btn { align-self: flex-start; color: var(--ink); border-color: var(--ink); }
.watch-art { display: flex; gap: 8px; margin-top: 4px; }
.watch-art .back { --monte-w: 44px; transform: rotate(-6deg); }
.watch-art .back:nth-child(2) { transform: rotate(2deg); }
.watch-art .back:nth-child(3) { transform: rotate(9deg); }

/* ---------- Barra da gaveta ---------- */
.drawerbar {
  height: var(--drawer-h); flex: 0 0 auto;
  display: grid; grid-template-columns: repeat(4, 1fr);
  background: var(--paper); border-top: 3px solid var(--wood);
  color: var(--ink);
}
.tab {
  position: relative; height: 100%;
  display: flex; align-items: center; justify-content: center; gap: 6px;
  background: transparent; border: 0; border-right: 1px solid var(--paper-line);
  font-size: 16px; font-weight: 700; color: var(--ink);
}
.tab:last-child { border-right: 0; }
.tab svg { width: 22px; height: 22px; flex: 0 0 auto; }
.badge { min-width: 24px; height: 24px; padding: 0 6px; border-radius: 12px; background: var(--alert); color: #fff; font-size: 16px; line-height: 24px; font-weight: 800; text-align: center; }
.tab.active { box-shadow: inset 0 -4px 0 var(--ink); background: var(--paper-shade); }

/* Gaveta aberta */
.scrim { position: absolute; inset: 0; z-index: 30; background: rgba(8, 24, 17, 0.62); }
.sheet {
  position: absolute; z-index: 31; left: 0; right: 0; bottom: 0; height: 60%;
  display: flex; flex-direction: column;
  background: var(--paper); color: var(--ink);
  border-top: 4px solid var(--wood);
  border-radius: 22px 22px 0 0;
  box-shadow: 0 -12px 30px rgba(6, 31, 20, 0.4);
}
.grab { width: 48px; height: 5px; border-radius: 3px; background: var(--ink-muted); margin: 8px auto 2px; }
.sheet-head { display: flex; align-items: center; gap: 4px; padding: 0 8px 0 8px; border-bottom: 1px solid var(--paper-line); }
.sheet-tabs { flex: 1 1 auto; display: flex; }
.sheet-tab { height: 48px; padding: 0 10px; display: inline-flex; align-items: center; gap: 6px; border: 0; background: transparent; font-size: 16px; font-weight: 700; color: var(--ink); }
.sheet-tab.active { box-shadow: inset 0 -4px 0 var(--ink); }
.sheet-tab .badge { display: none; }
.close { width: 44px; height: 44px; border-radius: 50%; border: 2px solid var(--ink); background: var(--paper); color: var(--ink); display: grid; place-items: center; flex: 0 0 auto; }
.close svg { width: 18px; height: 18px; }
.msgs { flex: 1 1 auto; overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end; gap: 10px; padding: 12px 14px; }
.msg { max-width: 86%; padding: 8px 12px; border-radius: 14px; background: var(--paper-shade); font-size: 16px; line-height: 22px; }
.msg b { display: block; font-size: 16px; }
.msg.mine { align-self: flex-end; background: #dfeee2; }
.msg.sys { align-self: center; background: transparent; color: var(--ink-muted); font-weight: 600; padding: 0; }
.compose { display: flex; gap: 8px; padding: 10px 12px 12px; border-top: 1px solid var(--paper-line); }
.field { flex: 1 1 auto; height: 48px; border-radius: 12px; border: 2px solid #6f7f72; background: #fffdf7; display: flex; align-items: center; padding: 0 12px; font-size: 16px; color: var(--ink-muted); }
.send { height: 48px; padding: 0 16px; border-radius: 12px; border: 2px solid var(--ink); background: var(--ink); color: var(--paper); font-size: 16px; font-weight: 800; }

/* Detalhe do assento (popover) */
.pop {
  position: absolute; z-index: 25; width: 260px;
  padding: 12px 14px 12px;
  border-radius: 14px; background: var(--paper); color: var(--ink);
  border: 2px solid var(--ink);
  box-shadow: 0 14px 30px rgba(6, 31, 20, 0.5);
}
.pop::before { content: ''; position: absolute; top: -9px; left: var(--arrow, 40px); width: 14px; height: 14px; background: var(--paper); border-left: 2px solid var(--ink); border-top: 2px solid var(--ink); transform: rotate(45deg); }
.pop h3 { margin: 0 0 4px; font-size: 18px; line-height: 22px; }
.pop p { margin: 0 0 8px; font-size: 16px; line-height: 22px; }
.pop .btn { color: var(--ink); border-color: var(--ink); }

/* ---------- 360 px: largura compacta ---------- */
body.compact {
  --pad: 6px; --gap: 6px; --hdr-h: 52px;
  --cell-pad-x: 4px; --avatar: 20px;
  --strip-col-gap: 6px;
  --discard-w: 66px; --monte-w: 50px;
  --card-gap: 8px;
}
body.compact .plate .avatar { --avatar: 30px; }
body.compact .center { gap: 16px; }
body.compact .btn-primary { padding: 0 16px; }
body.compact .hand-title { font-size: 20px; }

/* ---------- Desktop ---------- */
body.desk { background: radial-gradient(circle at 1rem 1rem, rgba(68,95,68,.07) 1px, transparent 1.5px) 0 0 / 24px 24px, linear-gradient(155deg, #f8f3e8, #f4efe3 62%, #e9e2d2); }
body.desk .app { padding: 12px; }
body.desk .shell { border-radius: 26px; border-bottom-width: var(--frame); align-items: center; }
body.desk { --frame: 5px; --pad: 10px; --gap: 10px; --hdr-h: 60px; --discard-w: 84px; --monte-w: 60px; --card-gap: 14px; --hand-pad: 12px; }
body.desk .shell > .region { width: 760px; }
body.desk .drawerbar { display: none; }
body.desk .hdr-tabs { display: flex; gap: 6px; }

const params = new URLSearchParams(location.search);
const S = STATES[params.get('state') || 's1'];

const W = innerWidth, Hh = innerHeight;

// Escada de degradação (vertical): 0 = completa; 1 = faixa em uma fileira; 2 = mão em uma fileira.
const ladder = { stripRows: 2, handRows: 2, steps: [] };

function seatTag(seat, idx) {
  const [, , role] = seat;
  if (idx === S.turn) return '<span class="tag-turn">na vez</span>';
  if (role === 'off') return '<span class="tag">⏸</span>';
  if (role === 'sub') return '<span class="tag">robô</span>';
  if (role === 'me') return '<span class="tag">você</span>';
  return '';
}
function seatCell(seat, idx) {
  const [p, count, role] = seat;
  const cls = ['seat', role === 'me' ? 'me' : '', role === 'off' ? 'off' : '', role === 'sub' ? 'sub' : '', idx === S.turn ? 'turn' : '', S.focusSeat === idx ? 'focus' : ''].join(' ');
  const word = count === 1 ? 'carta' : 'cartas';
  return `<button class="${cls}" data-seat="${idx}" aria-label="${p.n}, ${count} ${word}${role === 'off' ? ', desconectada' : role === 'sub' ? ', substituto automático' : ''}${idx === S.turn ? ', na vez' : ''}">
    <span class="seat-top">${avatar(p.av)}${seatTag(seat, idx)}</span>
    <span class="seat-name">${p.n}</span>
    <span class="seat-count"><span class="count-num">${count}</span><span class="count-lbl">${word}</span></span>
  </button>`;
}

function stripHTML() {
  const n = S.seats.length;
  const note = S.observer ? `<div class="strip-note">${ICON.eye}Você acompanha esta rodada</div>` : '';
  return `<section class="strip region" data-region="faixa" aria-label="Assentos">${note}<div class="strip-scroller"><div class="seats" id="seats"></div></div></section>`;
}

function layoutSeats() {
  const n = S.seats.length;
  const seatsEl = document.getElementById('seats');
  const scroller = seatsEl.parentElement;
  const twoRows = n > 4 && ladder.stripRows === 2;
  let cols, pos = [];
  if (twoRows) {
    const top = Math.ceil(n / 2);
    cols = top;
    for (let i = 0; i < n; i++) {
      if (i < top) pos.push([0, i]);
      else pos.push([1, cols - 1 - (i - top)]);
    }
  } else {
    cols = n;
    for (let i = 0; i < n; i++) pos.push([0, i]);
  }
  const scroll = !twoRows && compact && n > 4;
  if (scroll) {
    seatsEl.style.gridTemplateColumns = `repeat(${cols}, 76px)`;
    scroller.style.margin = '0 14px';
  } else {
    const maxCell = desk ? 222 : 999;
    seatsEl.style.gridTemplateColumns = `repeat(${cols}, minmax(0, ${n <= 3 ? '150px' : (desk ? maxCell + 'px' : '1fr')}))`;
    seatsEl.style.justifyContent = 'center';
  }
  seatsEl.style.gridTemplateRows = twoRows ? 'auto auto' : 'auto';
  seatsEl.innerHTML = '<svg class="track" id="track"></svg>' + S.seats.map((s, i) => seatCell(s, i).replace('<button ', `<button style="grid-row:${pos[i][0] + 1};grid-column:${pos[i][1] + 1}" `)).join('');
  const strip = seatsEl.closest('.strip');
  strip.querySelectorAll('.strip-hint').forEach((e) => e.remove());
  // Faixa de retorno (lane) apenas em fileira única e quando há altura.
  const lane = !twoRows && !scroll && !compact;
  strip.style.setProperty('--lane', lane ? '16px' : '0px');
  if (scroll) {
    // rola para manter a vez visível, como no produto
    const cellW = 76 + 6;
    const first = Math.max(0, Math.min(S.turn - 3, n - 4));
    seatsEl.style.transform = `translateX(${-first * cellW}px)`;
    if (first + 4 < n) strip.insertAdjacentHTML('beforeend', `<span class="strip-hint right" aria-hidden="true">${ICON.chevR}</span>`);
    if (first > 0) strip.insertAdjacentHTML('beforeend', `<span class="strip-hint left" aria-hidden="true">${ICON.chevL}</span>`);
    ladder.scrollFirst = first;
  }
  seatsEl.querySelectorAll('.tag-turn').forEach(tag => {
    tag.textContent = tag.closest('.seat').getBoundingClientRect().width < 88 ? 'vez' : 'na vez';
  });
  ladder.twoRows = twoRows;
  ladder.lane = lane;
  ladder.pos = pos;
}

function drawTrack() {
  const e=document.getElementById('seats'), svg=document.getElementById('track');
  const w=e.getBoundingClientRect().width, n=S.seats.length, two=n>4, h=two?(CONCEPT==='b'?258:CONCEPT==='a'?248:236):150;
  e.closest('.strip').style.height=h+'px';
  const H=e.closest('.strip').getBoundingClientRect().height;
  const cw=(w-42)/4, left=6, step=cw+10;
  e.querySelectorAll('.pawn,.medallion').forEach(x=>x.remove());
  const boxes=[];
  [...e.querySelectorAll('.seat')].forEach((cell,i)=>{
    const row=i<4?0:1, col=row===0?i:7-i;
    const arch=CONCEPT==='b'?([9,0,0,9][col]):0;
    const y=CONCEPT==='a'?(row?H-94:0):CONCEPT==='b'?(row?H-103+(9-arch):arch):(row?H-97:17);
    cell.style.left=(left+col*step)+'px';cell.style.top=y+'px';cell.style.width=cw+'px';
    cell.style.gridRow='auto';cell.style.gridColumn='auto';
    if(CONCEPT==='b')cell.style.transform=`rotate(${[-3,-1,1,3][col]*(row?-1:1)}deg)`;
    if(CONCEPT==='c' && i===S.turn)cell.style.transform='translateY(-6px) rotate(-2deg)';
    cell.querySelector('.tag-turn')?.replaceChildren(document.createTextNode(cw<88?'vez':'na vez'));
    boxes.push({x:left+col*step,y,cx:left+col*step+cw/2,row});
  });
  const ink='#203a2f',gold='#ffd36c',wood='#d6bd78',paper='#fffaf0';
  const defs=`<defs><linearGradient id="brass" x2="0" y2="1"><stop stop-color="#fff0bd"/><stop offset=".45" stop-color="#ffd36c"/><stop offset="1" stop-color="#a88a45"/></linearGradient><marker id="flow" viewBox="0 0 24 24" refX="16" refY="12" markerWidth="2.1" markerHeight="2.1" orient="auto"><path d="M1 5 Q9 4 11 1 L23 12 11 23 Q9 20 1 19 L8 12Z" fill="${gold}" stroke="${ink}" stroke-width="1"/></marker></defs>`;
  let art='';
  if(CONCEPT==='a'){
    const y1=two?112:112,y2=two?H-112:112;
    const d=two?`M${left+cw/2} ${y1} H${w-25} Q${w-7} ${y1} ${w-7} ${(y1+y2)/2} Q${w-7} ${y2} ${w-25} ${y2} H${left+cw/2}`:`M${left+cw/2} ${y1} H${w-24}`;
    art+=`<path d="${d}" fill="none" stroke="#0c2d20" stroke-width="24" stroke-linecap="round"/><path d="${d}" fill="none" stroke="url(#brass)" stroke-width="18" stroke-linecap="round" marker-end="url(#flow)"/><path d="${d}" fill="none" stroke="${ink}" stroke-width="2" stroke-dasharray="2 12"/>`;
    boxes.forEach((b,i)=>{art+=`<path d="M${b.cx} ${b.row?y2:b.y+92} V${b.row?b.y:y1}" stroke="${wood}" stroke-width="5"/><circle cx="${b.cx}" cy="${b.row?y2:y1}" r="7" fill="${paper}" stroke="${ink}" stroke-width="2"/>`;});
    // Cabeça larga integrada na curva, não um símbolo solto entre jogadores.
    if(two)art+=`<path d="M${w-16} ${y1-4} Q${w+1} ${y1+1} ${w-3} ${y1+18} L${w-15} ${y1+10} L${w-8} ${y1+10} Q${w-9} ${y1+2} ${w-18} ${y1+3}Z" fill="${ink}"/>`;
    const b=boxes[S.turn];
    e.insertAdjacentHTML('beforeend',`<svg class="pawn" style="left:${b.cx-21}px;top:${b.row?y2-32:y1-20}px" viewBox="0 0 42 50" aria-hidden="true"><ellipse cx="21" cy="44" rx="19" ry="5" fill="#0b281c"/><path d="M9 39 Q14 30 14 22 H28 Q28 30 33 39 Q36 43 31 45 H11 Q6 43 9 39Z" fill="url(#brass)" stroke="${ink}" stroke-width="2"/><circle cx="21" cy="14" r="11" fill="${paper}" stroke="${ink}" stroke-width="3"/><circle cx="18" cy="11" r="3" fill="${gold}"/></svg>`);
  }else if(CONCEPT==='b'){
    const y1=two?119:119,y2=two?H-116:119;
    const d=two?`M14 ${y1} Q${w/2} ${y1-28} ${w-14} ${y1} Q${w+1} ${(y1+y2)/2} ${w-14} ${y2} Q${w/2} ${y2+28} 14 ${y2}`:`M14 ${y1} Q${w/2} ${y1-30} ${w-14} ${y1}`;
    art+=`<path d="${d}" fill="none" stroke="${ink}" stroke-width="12"/><path d="${d}" fill="none" stroke="${wood}" stroke-width="7" stroke-linecap="round" marker-end="url(#flow)"/>`;
    e.insertAdjacentHTML('beforeend',`<svg class="medallion" style="left:${w/2-30}px;top:${two?(H/2-30):97}px" viewBox="0 0 60 60" aria-hidden="true"><circle cx="30" cy="30" r="28" fill="url(#brass)" stroke="${ink}" stroke-width="2"/><circle cx="30" cy="30" r="22" fill="${ink}"/><path d="M15 32 A16 16 0 1 1 39 43" fill="none" stroke="${paper}" stroke-width="6" stroke-linecap="round"/><path d="M38 35 L49 43 36 49Z" fill="${paper}"/><circle cx="30" cy="30" r="5" fill="${gold}"/></svg>`);
  }else{
    const y1=9,y2=two?H-105:9;
    const d=two?`M7 ${y1} H${w-22} Q${w-5} ${y1} ${w-5} ${y1+18} V${y2-18} Q${w-5} ${y2} ${w-22} ${y2} H22`:`M7 ${y1} H${w-24}`;
    art+=`<path d="${d}" fill="none" stroke="${ink}" stroke-width="22"/><path d="${d}" fill="none" stroke="url(#brass)" stroke-width="16" marker-end="url(#flow)"/><path d="${d}" fill="none" stroke="${paper}" stroke-width="1" stroke-dasharray="4 5"/>`;
    boxes.forEach(b=>art+=`<path d="M${b.cx-3} ${b.row?y2:y1-5} Q${b.cx-7} ${b.y+2} ${b.cx} ${b.y+3} Q${b.cx+7} ${b.y+2} ${b.cx+3} ${b.row?y2:y1-5}" fill="none" stroke="${paper}" stroke-width="3"/>`);
    if(two)art+=`<path d="M${w-17} ${y2-6} L${w-5} ${y2+6} L${w-5} ${y2+20} L${w-20} ${y2+7}Z" fill="#a88a45" stroke="${ink}"/>`;
  }
  svg.innerHTML=defs+art;
}

function centerHTML() {
  const d = S.discard;
  return `<section class="center region" data-region="centro" aria-label="Mesa">
    <div class="pile monte"><div class="back" role="img" aria-label="Monte com ${S.monte} cartas"></div><div class="monte-line"><span class="pile-lbl">Monte</span><span class="monte-num">${S.monte}</span></div></div>

  </section>`;
}

function bandHTML() {
  const b = S.band;
  let inner = '';
  if (b.primary) inner += `<button class="btn btn-primary${S.confirm ? '' : ''}">${b.primary}</button>`;
  if (S.paused) inner += '<div class="waiting">Aguardando Carla voltar</div>';
  else if (b.waiting) inner += `<div class="waiting"><span class="dots"><i></i><i></i><i></i></span><span><b>${b.waiting.split(' ')[0]}</b> está jogando</span></div>`;
  else inner += '<span class="spacer"></span>';
  inner += `<button class="btn">${ICON.bell}Avisar última</button><button class="btn">${ICON.flag}Denunciar</button>`;
  return `<section class="band region${b.primary ? '' : ' waiting-only'}" data-region="acoes" aria-label="Ações">${inner}</section>`;
}

function handHTML() {
  if (S.observer) {
    return `<section class="hand region" data-region="mao" aria-label="Assistindo"><div class="watch"><h2>Você está assistindo</h2><p>Você entra na próxima rodada. Enquanto isso, acompanhe a mesa e converse no Chat.</p><div class="watch-art" aria-hidden="true"><div class="back"></div><div class="back"></div><div class="back"></div></div><button class="btn">${ICON.chat}Abrir Chat</button></div></section>`;
  }
  const own = S.turn === 0;
  const n = S.hand.length;
  const conf = S.confirm ? `<div class="confirm" role="group" aria-label="Confirmar jogada"><div class="confirm-text">Jogar ${cardName(S.confirm)}?<small>Toque em Jogar para confirmar</small></div><button class="btn-go">Jogar</button><button class="btn">Cancelar</button></div>` : '';
  return `<section class="hand region${ladder.handRows === 1 ? ' one-row' : ''}" data-region="mao" aria-label="Sua mão">
    <div class="hand-head"><span class="hand-title">Sua mão</span><button class="help" aria-label="Ajuda">?</button><span class="spacer"></span><span class="hand-count">${n} cartas</span>${own ? '<span class="yourturn">✦ Sua vez</span>' : ''}</div>
    <div class="cards">${S.hand.map((c) => card(c)).join('')}</div>
    <span class="hand-hint" aria-hidden="true">${ICON.chevR}</span>

}

function headerHTML() {
  const own = S.turn === 0 && !S.observer;
  const tp = S.seats[S.turn][0];
  const dirTxt = S.dir === 'cw' ? 'Sentido horário' : 'Sentido anti-horário';
  const turnTxt = S.paused ? 'Rodada pausada' : own ? '<span class="spark">✦</span> Sua vez' : `Vez de <b>${tp.n.split(' ')[0]}</b>`;
  const tabs = `<nav class="hdr-tabs" aria-label="Gaveta">${tabBtns('hdr-tab')}</nav>`;
  return `<header class="hdr region" data-region="cabecalho">
    <div class="plate" role="status" aria-live="polite">${own ? '' : avatar(tp.av)}<div class="plate-text"><div class="turn-text">${turnTxt}</div><div class="dir-text">${S.dir === 'cw' ? ICON.cw : ICON.ccw}${dirTxt}</div></div></div>

function tabBtns(cls) {

function popHTML() {
  if (S.pop == null) return '';
  const [p, count, role] = S.seats[S.pop];
  const txt = role === 'off' ? `${p.n} desconectou. Rodada pausada; retorno em até 90 segundos.` : role === 'sub' ? `${p.n} saiu da mesa. Um substituto automático joga por ${p.n === 'Davi' ? 'ele' : 'ela'} até a volta.` : `${count} cartas. Presença: conectada. Nome completo deste assento.`;
  return `<div class="pop" id="pop" role="dialog" aria-label="${p.n}"><h3>${p.n} · ${count} cartas</h3><p>${txt}</p><button class="btn">Fechar</button></div>`;

function render() {
  const own = S.turn === 0 && !S.observer;
  document.getElementById('app').innerHTML = `
    <main class="shell${own ? ' own-turn' : ''}" id="shell">
      ${headerHTML()}
      ${stripHTML()}
      ${centerHTML()}
      ${S.observer ? '' : bandHTML()}
      ${handHTML()}
      ${toastHTML()}
      ${popHTML()}
    </main>
    <nav class="drawerbar region" data-region="gaveta" aria-label="Gaveta">${tabBtns('tab')}</nav>
    ${drawerHTML()}`;
  layoutSeats();
}

function overflowing() {
  // conteúdo da shell não pode passar da altura disponível
  const shell = document.getElementById('shell');
  const sr = shell.getBoundingClientRect();
  const kids = [...shell.querySelectorAll(':scope > .region')];
  const last = kids[kids.length - 1].getBoundingClientRect();
  const padBottom = parseFloat(getComputedStyle(shell).paddingBottom);
  return last.bottom + padBottom > sr.bottom + 0.5;
}

render();
// Escada: aplica passos até caber.
// Todos os assentos permanecem visíveis conforme decisão do coordenador.
if (Hh <= 800 && !desk) ladder.steps.push('cabecalho-respiro-centro-compactos');
if (Hh <= 800 && !S.observer) { ladder.handRows = 1; ladder.steps.push('mao-1-fileira'); render(); }
if (compact) ladder.steps.push('avatar-20px (largura < 400)');
drawTrack();

// Posiciona popover sob o assento indicado.
if (S.pop != null) {
  const cell = document.querySelector(`.seat[data-seat="${S.pop}"]`).getBoundingClientRect();
  const shell = document.getElementById('shell').getBoundingClientRect();
  const pop = document.getElementById('pop');
  const pw = Math.min(260, shell.width - 24);
  pop.style.width = pw + 'px';
  let left = cell.left + cell.width / 2 - pw / 2 - shell.left;
  left = Math.max(10, Math.min(left, shell.width - pw - 10));
  pop.style.left = left + 'px';
  pop.style.top = (cell.bottom - shell.top + 12) + 'px';
  pop.style.setProperty('--arrow', (cell.left + cell.width / 2 - shell.left - left - 9) + 'px');
}

// ----- Medição exposta para o script de renderização -----
window.__measure = () => {
  const shell = document.getElementById('shell');
  const sr = shell.getBoundingClientRect();
  const cs = getComputedStyle(shell);
  const regions = [...document.querySelectorAll('.region')].map((e) => { const r = e.getBoundingClientRect(); return { region: e.dataset.region, top: Math.round(r.top * 10) / 10, height: Math.round(r.height * 10) / 10, bottom: Math.round(r.bottom * 10) / 10, width: Math.round(r.width * 10) / 10 }; });
  const shellRegions = [...shell.querySelectorAll(':scope > .region')];
  const lastBottom = shellRegions[shellRegions.length - 1].getBoundingClientRect().bottom;
  return {
