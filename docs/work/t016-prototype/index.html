<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0A1310">
  <meta name="description" content="Protótipo navegável da mesa do Tretta: jogo de cartas para família e amigos.">
  <title>Tretta — mesa de jogo</title>
  <link rel="preload" href="assets/fonts/fraunces.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/atkinson.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="assets/app.css?v=15">
</head>
<body>
  <a class="pular" href="#mesa">Ir para a mesa</a>

  <svg class="sprite" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
    <symbol id="ic-bloqueio" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="8.2" fill="none" stroke="currentColor" stroke-width="2.1"/>
      <path d="M6.4 6.4 17.6 17.6" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"/>
    </symbol>
    <symbol id="ic-inversao" viewBox="0 0 24 24">
      <path d="M5.5 9.2A6.4 6.4 0 0 1 15.6 4.6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      <path d="M15.7 2.8v4.1h-4.1" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M18.5 14.8A6.4 6.4 0 0 1 8.4 19.4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      <path d="M8.3 21.2v-4.1h4.1" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    <symbol id="ic-coringa" viewBox="0 0 24 24">
      <circle cx="12" cy="7.3" r="3.4" fill="currentColor" opacity=".95"/>
      <circle cx="16.7" cy="12" r="3.4" fill="currentColor" opacity=".72"/>
      <circle cx="12" cy="16.7" r="3.4" fill="currentColor" opacity=".95"/>
      <circle cx="7.3" cy="12" r="3.4" fill="currentColor" opacity=".72"/>
      <circle cx="12" cy="12" r="1.5" fill="none" stroke="currentColor" stroke-width="1.2"/>
    </symbol>
    <symbol id="ic-cartas" viewBox="0 0 24 24">
      <rect x="4" y="6" width="10" height="14" rx="2" transform="rotate(-9 9 13)" fill="none" stroke="currentColor" stroke-width="1.9"/>
      <rect x="9" y="4" width="10" height="14" rx="2" transform="rotate(7 14 11)" fill="none" stroke="currentColor" stroke-width="1.9"/>
    </symbol>
    <symbol id="ic-conversa" viewBox="0 0 24 24">
      <path d="M4.5 6.5h15v9.2h-8.1L7 20v-4.3H4.5z" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"/>
      <path d="M8 10.2h8M8 13.2h5" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/>
    </symbol>
    <symbol id="ic-historico" viewBox="0 0 24 24">
      <path d="M5 6.5h14M5 12h14M5 17.5h9" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/>
      <circle cx="3.4" cy="6.5" r="1" fill="currentColor"/><circle cx="3.4" cy="12" r="1" fill="currentColor"/><circle cx="3.4" cy="17.5" r="1" fill="currentColor"/>
    </symbol>
    <symbol id="ic-mesa" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="5.2" fill="none" stroke="currentColor" stroke-width="1.9"/>
      <circle cx="12" cy="3.9" r="1.5" fill="currentColor"/><circle cx="20.1" cy="12" r="1.5" fill="currentColor"/>
      <circle cx="12" cy="20.1" r="1.5" fill="currentColor"/><circle cx="3.9" cy="12" r="1.5" fill="currentColor"/>
    </symbol>
    <symbol id="ic-olho" viewBox="0 0 24 24">
      <path d="M2.8 12S6.4 5.8 12 5.8 21.2 12 21.2 12 17.6 18.2 12 18.2 2.8 12 2.8 12z" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"/>
      <circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.9"/>
    </symbol>
    <symbol id="ic-pausa" viewBox="0 0 24 24">
      <rect x="6.4" y="5" width="3.8" height="14" rx="1.4" fill="currentColor"/>
      <rect x="13.8" y="5" width="3.8" height="14" rx="1.4" fill="currentColor"/>
    </symbol>
    <symbol id="ic-caiu" viewBox="0 0 24 24">
      <path d="M3 9.5a13 13 0 0 1 6-3.3M21 9.5a13 13 0 0 0-4.5-2.8M6.4 13.4a9.6 9.6 0 0 1 3.4-1.8M17.6 13.4a9.6 9.6 0 0 0-2.1-1.4" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/>
      <circle cx="12" cy="18.2" r="1.5" fill="currentColor"/>
      <path d="M4.3 4.3 19.7 19.7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    </symbol>
    <symbol id="ic-bot" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.9"/>
      <path d="M12 2.8v3M12 18.2v3M2.8 12h3M18.2 12h3M5.5 5.5l2.1 2.1M16.4 16.4l2.1 2.1M18.5 5.5l-2.1 2.1M7.6 16.4l-2.1 2.1" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/>
    </symbol>
    <symbol id="ic-coroa" viewBox="0 0 24 24">
      <path d="M4 8.2l3.8 3 4.2-6 4.2 6 3.8-3-1.4 10H5.4z" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"/>
      <path d="M5.8 20.4h12.4" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/>
    </symbol>
    <symbol id="ic-fechar" viewBox="0 0 24 24">
      <path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"/>
    </symbol>
    <symbol id="ic-reagir" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="8.6" fill="none" stroke="currentColor" stroke-width="1.9"/>
      <circle cx="9.1" cy="10" r="1.2" fill="currentColor"/>
      <circle cx="14.9" cy="10" r="1.2" fill="currentColor"/>
      <path d="M8.4 14.1c.9 2 2.1 3 3.6 3s2.7-1 3.6-3z" fill="currentColor"/>
    </symbol>
  </svg>

  <div class="app" id="app">
    <header class="topo" id="topo">
      <button class="marca" id="marca" type="button" data-foco="marca" data-abrir="mesa" aria-label="Sala: código, jogadores, regras e convite">
        <svg class="ic" aria-hidden="true"><use href="#ic-mesa"></use></svg>
        <span class="marca-rotulo">Sala</span>
      </button>
      <div class="topo-vez" id="topo-vez"></div>
      <div class="topo-sentido" id="topo-sentido"></div>
    </header>

    <div class="mesa-wrap">
      <section class="mesa" id="mesa" tabindex="-1" aria-label="Mesa de jogo">
        <div class="feltro" aria-hidden="true"></div>
        <svg class="trilho" id="trilho" aria-hidden="true" focusable="false">
          <path class="trilho-base" id="trilho-base" d=""></path>
          <path class="trilho-luz" id="trilho-luz" d=""></path>
        </svg>
        <div class="centro" id="centro"></div>
        <div class="assentos" id="assentos" role="group" aria-label="Assentos da mesa"></div>
        <div class="pausa" id="pausa" hidden></div>
        <div class="brilho-vez" id="brilho-vez" aria-hidden="true"></div>
      </section>
    </div>

    <div class="acoes" id="acoes"></div>
    <div class="toast" id="toast" role="status" hidden></div>

    <section class="mao-wrap" id="mao-wrap" aria-label="Sua mão">
      <div class="bandeja" id="bandeja" hidden></div>
      <div class="mao-cabeca" id="mao-cabeca"></div>
      <div class="mao" id="mao"></div>
    </section>

    <div class="reacoes-bandeja" id="reacoes-bandeja" hidden>
      <p class="reacoes-rotulo" id="reacoes-rotulo">Reagir à jogada</p>
      <div class="reacoes-grade" id="reacoes-grade" role="group" aria-labelledby="reacoes-rotulo"></div>
      <p class="reacoes-dica">Todos na mesa veem · some sozinho</p>
    </div>

    <nav class="gaveta-barra" aria-label="Conteúdo da mesa">
      <button class="barra-item" type="button" data-foco="barra-conversa" data-abrir="conversa">
        <svg class="ic" aria-hidden="true"><use href="#ic-conversa"></use></svg>
        <span>Conversa</span>
        <span class="selo" id="selo-conversa" hidden>0</span>
      </button>
      <button class="barra-item" id="barra-reagir" type="button" data-foco="barra-reagir" aria-expanded="false" aria-controls="reacoes-bandeja">
        <svg class="ic" aria-hidden="true"><use href="#ic-reagir"></use></svg>
        <span>Reagir</span>
      </button>
      <button class="barra-item" type="button" data-foco="barra-historico" data-abrir="historico">
        <svg class="ic" aria-hidden="true"><use href="#ic-historico"></use></svg>
        <span>Histórico</span>
      </button>
    </nav>

    <div class="gaveta-scrim" id="gaveta-scrim" hidden></div>
    <aside class="gaveta" id="gaveta" role="dialog" aria-modal="true" aria-labelledby="gaveta-titulo" aria-hidden="true">
      <div class="gaveta-puxador" aria-hidden="true"></div>
      <div class="gaveta-topo">
        <div>
          <p class="gaveta-sobretitulo">Sala da Vó Cida</p>
          <h2 id="gaveta-titulo">Conversa</h2>
        </div>
        <button class="botao-icone" type="button" id="gaveta-fechar" aria-label="Fechar gaveta" data-foco="gaveta-fechar">
          <svg class="ic" aria-hidden="true"><use href="#ic-fechar"></use></svg>
        </button>
      </div>
      <div class="gaveta-abas" id="gaveta-abas" role="tablist" aria-label="Conteúdo secundário"></div>
      <div class="gaveta-corpo" id="gaveta-corpo" role="tabpanel" tabindex="0"></div>
    </aside>

    <div class="camada" id="overlays"></div>
    <p class="sr-only" id="live" aria-live="polite" aria-atomic="true"></p>
  </div>

  <script src="assets/app.js?v=15"></script>
</body>
</html>
